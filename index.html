<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Tidehook</title>
    <!-- the dock's hook, drawn inline: a tab icon and no 404 for /favicon.ico, for the
         price of a line (the portal shows the game in an iframe, which wants none) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23123a52'/%3E%3Cg fill='none' stroke='%23d9a441' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='21' cy='8' r='2.6' stroke-width='2'/%3E%3Cpath d='M21 10.6v9a5 5 0 0 1-10 0v-5' stroke-width='3'/%3E%3Cpath d='M11 14.5l4 4' stroke-width='2.4'/%3E%3C/g%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #123a52; touch-action: none; }
      canvas { display: block; }
      /* no text selection, long-press menu or tap flash on touch screens (a portal requirement) */
      html, body, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
